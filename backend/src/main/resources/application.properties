server.port=8080

spring.application.name=delivery-tracker

spring.datasource.url=jdbc:h2:mem:deliverydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=9a6747f6f12c45f002d624f4e226e49d7b819e7b8f65e495020130b0a8feda42
jwt.expirationMs=86400000

logging.level.com.delivery.tracker=INFO
logging.level.org.springframework.security=WARN
